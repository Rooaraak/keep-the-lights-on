[profile.default]
src = "src"
test = "test"
out = "out"
libs = ["lib"]
solc = "0.8.26"
optimizer = true
optimizer_runs = 200
bytecode_hash = "none"
cbor_metadata = false
fs_permissions = [{ access = "read", path = "../data" }, { access = "read", path = "./data" }, { access = "read-write", path = "../data/vectors.json" }]

[lint]
lint_on_build = false

[rpc_endpoints]
sepolia = "https://ethereum-sepolia-rpc.publicnode.com"

[invariant]
runs = 48
depth = 200
fail_on_revert = true
