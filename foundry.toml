# Keep the Lights On: the contracts (src/), their tests (test/) and forge-std (lib/).
[profile.default]
src = "src"
test = "test"
out = "out"
cache_path = "cache"
libs = ["lib"]
solc = "0.8.26"
optimizer = true
optimizer_runs = 200
bytecode_hash = "none"
cbor_metadata = false
fs_permissions = [{ access = "read", path = "./data" }]

[lint]
lint_on_build = false

[invariant]
runs = 48
depth = 200
fail_on_revert = true
