# The Foundry project, run from the repository root (the contracts and their tests live in contracts/).
# `forge test` works from here and from contracts/ (which has its own foundry.toml).
[profile.default]
src = "contracts/src"
test = "contracts/test"
out = "out"
cache_path = "cache"
libs = ["contracts/lib"]
solc = "0.8.26"
optimizer = true
optimizer_runs = 200
bytecode_hash = "none"
cbor_metadata = false
fs_permissions = [{ access = "read", path = "./data" }]

[lint]
lint_on_build = false

[invariant]
runs = 48
depth = 200
fail_on_revert = true
